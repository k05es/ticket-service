spring.application.name=ticket-service

# Подключение к PostgreSQL. Значения передаются через переменные окружения.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ticket_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate проверяет соответствие JPA-сущностей существующей SQL-схеме.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Часовой пояс ежедневного сброса статистики специалистов.
app.statistics.time-zone=${STATISTICS_TIME_ZONE:UTC}