spring.application.name=ticket-service

# Подключение к PostgreSQL. Значения передаются через переменные окружения.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ticket_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate проверяет соответствие JPA-сущностей существующей SQL-схеме.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Часовой пояс ежедневного сброса статистики специалистов.
app.statistics.time-zone=${STATISTICS_TIME_ZONE:UTC}

# Настройки Spring Security и JWT (ЛР №4).
app.security.jwt.secret=${JWT_SECRET:ticket-service-super-secret-jwt-key-2026-min-32-chars}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Администратор по умолчанию для первоначального входа.
app.security.admin.init=${ADMIN_INIT:true}
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.email=${ADMIN_EMAIL:admin@ticketservice.local}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
