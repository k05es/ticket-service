variables:  MAVEN_CLI_OPTS: >-    --batch-mode    --errors    --fail-at-end    --show-version    --no-transfer-progress    -DinstallAtEnd=true    -DdeployAtEnd=truecache:  paths:    - .m2/repository.verify:  stage: test  script:    - '.\mvnw $MAVEN_CLI_OPTS verify'  tags:    - windowsverify:  extends:    - .verify